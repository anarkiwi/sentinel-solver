name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SENTINEL_REQUIRE_ORACLE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: out/csdb
          key: csdb-${{ hashFiles('sentinel/tests/csdb.py') }}
      - run: pip install -r requirements.txt black pylint pytest pytest-xdist
      - run: black --check sentinel driver conftest.py
      - run: pylint --rcfile=.pylintrc sentinel driver conftest.py
      - run: python -m sentinel.tests.csdb
      - run: pytest -n auto

  cudasim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          load: true
          tags: sentinel-cudasim
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm sentinel-cudasim pytest -n auto -m gpu sentinel/tests
